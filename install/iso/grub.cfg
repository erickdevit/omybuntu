set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png

loadfont /boot/grub/themes/omybuntu/unicode.pf2
terminal_output gfxterm

set theme=/boot/grub/themes/omybuntu/theme.txt

menuentry "Try or Install Omybuntu" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash noprompt ---
    initrd /casper/initrd
}
