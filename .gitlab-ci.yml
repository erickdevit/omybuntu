stages:
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9][0-9A-Za-z._+-]*$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "1"

build_iso:
  stage: build
  image: ubuntu:26.04
  tags:
    - saas-linux-medium-amd64
  timeout: 3h
  resource_group: omybuntu-iso
  interruptible: false
  cache:
    key: ubuntu-base-26.04-amd64
    paths:
      - ubuntu-base.tar.gz
    policy: pull-push
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      ca-certificates curl git grub-efi-amd64-bin grub-pc-bin imagemagick
      mtools rsync squashfs-tools sudo wget xorriso
  script:
    - |
      if [[ -n ${CI_COMMIT_TAG:-} ]]; then
        package_version=$CI_COMMIT_TAG
      else
        package_version="pipeline-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      fi

      export OMYBUNTU_ISO_VERSION="$package_version"
      package_file="omybuntu-${package_version}-amd64.iso"
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omybuntu/${package_version}"

      ./install/iso/build-iso.sh --clean
      test -s "$package_file"
      sha256sum "$package_file" > "$package_file.sha256"

      curl --fail-with-body --retry 3 --retry-all-errors \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$package_file" \
        "$package_url/$package_file"
      curl --fail-with-body --retry 3 --retry-all-errors \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$package_file.sha256" \
        "$package_url/$package_file.sha256"

      echo "Published ISO package: $package_url/$package_file"
  artifacts:
    name: "omybuntu-checksum-${CI_COMMIT_REF_SLUG}"
    paths:
      - "*.iso.sha256"
    expire_in: 30 days
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

release_iso:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build_iso
      artifacts: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9][0-9A-Za-z._+-]*$/
  script:
    - |
      package_file="omybuntu-${CI_COMMIT_TAG}-amd64.iso"
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omybuntu/${CI_COMMIT_TAG}"
      assets_links=$(printf '[{"name":"%s","url":"%s/%s","link_type":"package"},{"name":"%s.sha256","url":"%s/%s.sha256","link_type":"other"}]' \
        "$package_file" "$package_url" "$package_file" \
        "$package_file" "$package_url" "$package_file")

      if glab release view "$CI_COMMIT_TAG" --repo "$CI_PROJECT_PATH" >/dev/null 2>&1; then
        glab release create "$CI_COMMIT_TAG" \
          --repo "$CI_PROJECT_PATH" \
          --assets-links "$assets_links"
      else
        glab release create "$CI_COMMIT_TAG" \
          --repo "$CI_PROJECT_PATH" \
          --name "Omybuntu $CI_COMMIT_TAG" \
          --notes "ISO oficial do Omybuntu para a versão $CI_COMMIT_TAG." \
          --assets-links "$assets_links"
      fi
