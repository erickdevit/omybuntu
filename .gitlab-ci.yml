stages:
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(_(dev|rc)[0-9]+)?$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "0"

test_scripts:
  stage: test
  image: ubuntu:26.04
  tags:
    - saas-linux-small-amd64
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash git jq python3
  script:
    - ./test/omybuntu-cli-test.sh
    - ./test/omybuntu-iso-test.sh
    - ./test/omybuntu-update-available-test.sh

validate_release:
  stage: test
  image: ubuntu:26.04
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(_(dev|rc)[0-9]+)?$/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      set -euo pipefail

      case "$CI_COMMIT_TAG" in
        *_dev*) release_branch="dev" ;;
        *_rc*) release_branch="rc" ;;
        *) release_branch="master" ;;
      esac

      git fetch --quiet origin \
        "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$release_branch"; then
        echo "Tag $CI_COMMIT_TAG is not reachable from $release_branch" >&2
        exit 1
      fi

      if [[ $release_branch == "master" ]]; then
        checklist="release/checklists/$CI_COMMIT_TAG.md"
        [[ -f $checklist ]] || {
          echo "Missing stable release checklist: $checklist" >&2
          exit 1
        }
        grep -qx 'Status: approved' "$checklist" || {
          echo "Stable release checklist is not approved" >&2
          exit 1
        }
        if grep -q '^- \[ \]' "$checklist"; then
          echo "Stable release checklist still has pending items" >&2
          exit 1
        fi
      fi

build_iso:
  stage: build
  image: ubuntu:26.04
  tags:
    - saas-linux-medium-amd64
  timeout: 3h
  resource_group: omybuntu-iso
  interruptible: false
  cache:
    key: ubuntu-base-26.04-amd64
    paths:
      - ubuntu-base.tar.gz
    policy: pull-push
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      ca-certificates curl dosfstools gettext-base git gnupg
      grub-efi-amd64-bin grub-pc-bin imagemagick mtools rsync
      sbsigntool squashfs-tools sudo wget xorriso
  script:
    - |
      set -euo pipefail

      if [[ -n ${CI_COMMIT_TAG:-} ]]; then
        package_version=$CI_COMMIT_TAG
      else
        package_version="pipeline-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      fi

      export OMYBUNTU_ISO_VERSION="$package_version"
      package_file="omybuntu-${package_version}-amd64.iso"
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omybuntu/${package_version}"

      ./install/iso/build-iso.sh --clean
      test -s "$package_file"
      sha256sum "$package_file" > "$package_file.sha256"

      release_files=("$package_file" "$package_file.sha256")

      if [[ -n ${CI_COMMIT_TAG:-} ]]; then
        : "${OMYBUNTU_RELEASE_GPG_PRIVATE_KEY:?Configure the protected GPG private key file variable}"
        : "${OMYBUNTU_RELEASE_GPG_PASSPHRASE:?Configure the protected GPG passphrase variable}"
        : "${OMYBUNTU_RELEASE_KNOWN_ISSUES:?Describe known issues for this tagged release}"

        [[ -f $OMYBUNTU_RELEASE_GPG_PRIVATE_KEY ]] || {
          echo "OMYBUNTU_RELEASE_GPG_PRIVATE_KEY must be a GitLab file variable" >&2
          exit 1
        }

        export GNUPGHOME
        GNUPGHOME=$(mktemp -d)
        chmod 0700 "$GNUPGHOME"
        trap 'rm -rf "$GNUPGHOME"' EXIT

        gpg --batch --import "$OMYBUNTU_RELEASE_GPG_PRIVATE_KEY"
        release_fingerprint=$(gpg --batch --with-colons --list-secret-keys | \
          awk -F: '$1 == "fpr" { print $10; exit }')
        [[ -n $release_fingerprint ]] || {
          echo "No secret signing key was imported" >&2
          exit 1
        }

        if [[ -n ${OMYBUNTU_RELEASE_GPG_FINGERPRINT:-} ]] \
          && [[ $release_fingerprint != "$OMYBUNTU_RELEASE_GPG_FINGERPRINT" ]]; then
          echo "Imported GPG key does not match OMYBUNTU_RELEASE_GPG_FINGERPRINT" >&2
          exit 1
        fi

        git verify-tag "$CI_COMMIT_TAG"

        printf '%s' "$OMYBUNTU_RELEASE_GPG_PASSPHRASE" | \
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$release_fingerprint" \
            --output "$package_file.sig" --detach-sign "$package_file"
        gpg --batch --armor --export "$release_fingerprint" > omybuntu-release-key.asc

        export RELEASE_FILE="$package_file"
        export RELEASE_GPG_FINGERPRINT="$release_fingerprint"
        export RELEASE_KNOWN_ISSUES="$OMYBUNTU_RELEASE_KNOWN_ISSUES"
        export RELEASE_PACKAGE_URL="$package_url"
        export RELEASE_VERSION="$CI_COMMIT_TAG"
        envsubst '${RELEASE_FILE} ${RELEASE_GPG_FINGERPRINT} ${RELEASE_KNOWN_ISSUES} ${RELEASE_PACKAGE_URL} ${RELEASE_VERSION}' \
          < release/RELEASE_NOTES_TEMPLATE.md > release-notes.md

        release_files+=("$package_file.sig" omybuntu-release-key.asc release-notes.md)
      fi

      for release_file in "${release_files[@]}"; do
        curl --fail-with-body --retry 3 --retry-all-errors \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$release_file" \
          "$package_url/$release_file"
      done

      echo "Published ISO package: $package_url/$package_file"
  artifacts:
    name: "omybuntu-release-metadata-${CI_COMMIT_REF_SLUG}"
    paths:
      - "*.iso.sha256"
      - "*.iso.sig"
      - "omybuntu-release-key.asc"
      - "release-notes.md"
    expire_in: 30 days
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

release_iso:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build_iso
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(_(dev|rc)[0-9]+)?$/
  script:
    - |
      set -euo pipefail

      package_file="omybuntu-${CI_COMMIT_TAG}-amd64.iso"
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omybuntu/${CI_COMMIT_TAG}"
      assets_links=$(printf '[{"name":"%s","url":"%s/%s","link_type":"package"},{"name":"%s.sha256","url":"%s/%s.sha256","link_type":"other"},{"name":"%s.sig","url":"%s/%s.sig","link_type":"other"},{"name":"omybuntu-release-key.asc","url":"%s/omybuntu-release-key.asc","link_type":"other"}]' \
        "$package_file" "$package_url" "$package_file" \
        "$package_file" "$package_url" "$package_file" \
        "$package_file" "$package_url" "$package_file" \
        "$package_url")

      glab release create "$CI_COMMIT_TAG" \
        --repo "$CI_PROJECT_PATH" \
        --name "Omybuntu $CI_COMMIT_TAG" \
        --notes-file release-notes.md \
        --assets-links "$assets_links"
