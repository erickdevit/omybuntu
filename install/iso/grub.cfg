set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm

loadfont /boot/grub/themes/omybuntu/unicode.pf2
terminal_output gfxterm

set theme=/boot/grub/themes/omybuntu/theme.txt

menuentry "Try or Install Omybuntu" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 vt.handoff=7 noprompt ---
    initrd /casper/initrd
}
